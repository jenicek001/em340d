services:
  em340d:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        DIALOUT_GID: ${DIALOUT_GID:-20}
    container_name: em340d
    restart: unless-stopped
    
    # USB device resilience: Use privileged mode to allow container to access
    # devices dynamically even after USB reconnection. The /dev volume mount
    # ensures the container sees new device files when USB devices reconnect.
    privileged: true
    
    # Mount entire /dev directory to handle dynamic USB device reconnections
    volumes:
      - em340d_logs:/app/logs
      - /dev:/dev  # Full /dev access for USB device resilience
    
    # Environment variables for runtime configuration (from .env)
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC=${MQTT_TOPIC:-em340}
      - SERIAL_DEVICE=${SERIAL_DEVICE:-/dev/ttyUSB0}
      - MODBUS_ADDRESS=${MODBUS_ADDRESS:-1}
      - DEVICE_SERIAL_NUMBER=${DEVICE_SERIAL_NUMBER:-EM340_UNKNOWN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_TO_CONSOLE=${LOG_TO_CONSOLE:-true}
      - LOG_TO_FILE=${LOG_TO_FILE:-true}
      - LOG_FILE=${LOG_FILE:-/app/logs/em340d.log}
      - LOG_ROTATE=${LOG_ROTATE:-true}
      - LOG_ROTATE_SIZE=${LOG_ROTATE_SIZE:-1048576}
      - LOG_ROTATE_COUNT=${LOG_ROTATE_COUNT:-5}
      - DELAY_MS=${DELAY_MS:-50}
      - POLLING_INTERVAL_S=${POLLING_INTERVAL_S:-10}
    
    # Logging configuration with timestamps
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=em340d"
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import minimalmodbus; print(\"OK\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Network mode - using host networking for MQTT broker connectivity
    network_mode: "host"

# Named volumes for data persistence
volumes:
  em340d_logs:
    driver: local

